<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpongeBob Mad Libs</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
    </style>
</head>
<body>
    <div class="container">
        <h2>SpongeBob Mad Libs</h2>
        <p>Fill in the blanks and create your own SpongeBob story!</p>
        
        <input type="text" id="adjective" placeholder="Adjective">
        <input type="text" id="noun" placeholder="Noun">
        <input type="text" id="verb" placeholder="Verb">
        <input type="text" id="place" placeholder="Place">
        <input type="text" id="food" placeholder="Food">
        
        <button onclick="generateStory()">Generate Story</button>
        
        <p id="story"></p>
    </div>
    
<script src="js/script.js"></script>
</body>
</html>
